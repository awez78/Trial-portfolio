<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Login | Campus Circular</title>

    <link rel="stylesheet" href="student-login.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <link rel="stylesheet" href="login.css">
</head>

<body>

    <div class="login-page">

        <!-- Decorative shapes -->
        <div class="shape shape-one"></div>
        <div class="shape shape-two"></div>
        <div class="shape shape-three"></div>


        <!-- Login Card -->

        <div class="login-card">

            <!-- Left Side -->

            <div class="welcome-section">

                <div class="welcome-icon">
                    <i class="fa-solid fa-user-graduate"></i>
                </div>

                <span>STUDENT PORTAL</span>

                <h1>
                    Welcome<br>
                    Back!
                </h1>

                <p>
                    Connect with your campus community,
                    discover resources and share opportunities.
                </p>

                <div class="floating-icon icon-one">
                    <i class="fa-solid fa-book"></i>
                </div>

                <div class="floating-icon icon-two">
                    <i class="fa-solid fa-graduation-cap"></i>
                </div>

                <div class="floating-icon icon-three">
                    <i class="fa-solid fa-users"></i>
                </div>

            </div>


            <!-- Right Side -->

            <div class="form-section">

                <div class="form-header">

                    <h2>Student Login</h2>

                    <p>
                        Login using your university credentials.
                    </p>

                </div>


                <form>

                    <!-- MU NUMBER -->

                    <div class="input-group">

                        <label for="muNumber">
                            MU Number
                            <span>*</span>
                        </label>

                        <div class="input-box">

                            <i class="fa-solid fa-id-card"></i>

                            <input
                                type="text"
                                id="muNumber"
                                placeholder="Enter your MU Number"
                                required>

                        </div>

                        <small>
                            Your MU Number is required for authentication.
                        </small>

                    </div>


                    <!-- EMAIL -->

                    <div class="input-group">

                        <label for="email">
                            College Email
                        </label>

                        <div class="input-box">

                            <i class="fa-solid fa-envelope"></i>

                            <input
                                type="email"
                                id="email"
                                placeholder="example@university.ac.in"
                                required>

                        </div>

                    </div>


                    <!-- PASSWORD -->

                    <div class="input-group">

                        <label for="password">
                            Password
                        </label>

                        <div class="input-box">

                            <i class="fa-solid fa-lock"></i>

                            <input
                                type="password"
                                id="password"
                                placeholder="Enter your password"
                                required>

                            <i class="fa-solid fa-eye password-eye"></i>

                        </div>

                    </div>


                    <!-- OPTIONS -->

                    <div class="options">

                        <label class="remember">

                            <input type="checkbox">

                            Remember me

                        </label>

                        <a href="#">
                            Forgot Password?
                        </a>

                    </div>


                    <!-- BUTTON -->

                    <button type="submit" class="login-btn">

                        <span>Login as Student</span>

                        <i class="fa-solid fa-arrow-right"></i>

                    </button>

                </form>


                <div class="register-text">

                    Don't have an account?

                    <a href="signup.html">
                        Create Account
                    </a>

                </div>

            </div>

        </div>

    </div>

<script>
    const loginForm = document.querySelector("form");

    loginForm.addEventListener("submit", function (e) {
        e.preventDefault();

        window.location.href = "profile.html";
    });
</script>

</body>

</html>
